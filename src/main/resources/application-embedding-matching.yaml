# Merge the whole `unitrace:` additions below into application.yaml (you already have embedding + matching blocks;
# the NEW part is `desk`). Secrets only via environment variables.
unitrace:
  desk:
    handover-secret: ${HANDOVER_SECRET:dev-only-change-me}   # set a long random value in production
    key-ttl: 7d
    max-key-attempts: 5
    desk-email: ${DESK_EMAIL:}          # mailbox that gets "new potential match" mails; blank = log only
    zone: Asia/Kolkata
    drop-off-time: "17:00"
  embedding:
    base-url: ${EMBEDDING_BASE_URL:http://localhost:8000}
    api-key: ${EMBEDDING_API_KEY:}
    text-dimension: 384
    image-dimension: 512
    connect-timeout: 3s
    read-timeout: 30s
    job:
      enabled: true
      poll-interval: PT5S
      batch-size: 5
      max-attempts: 5
      lease-duration: 10m
      backoff-base: 30s
      backoff-max: 30m
  matching:
    text-weight: 0.5
    image-weight: 0.35
    time-weight: 0.15
    threshold: 0.55
    candidate-limit: 20
    max-matches-per-item: 10
    min-text-similarity: 0.30
    neutral-image-score: 0.5
    image-similarity-floor: 0.60
    image-similarity-ceiling: 0.95
    eligible-statuses: OPEN
    time-half-life: 48h
    time-max-gap: 14d
    time-found-before-lost-tolerance: 2h
    reject-impossible-time: true
